name: Publicar en Voriam

# Cada push a main compila la web y la sube al servidor de Voriam
# usando la API del panel (compatible con Pterodactyl).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: voriam
  cancel-in-progress: true

env:
  PANEL: https://panel.voriamtechnologies.com
  SERVER_ID: 089506a7
  SITE_URL: http://sftp-n1.voriamtechnologies.com:3011

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /

      - name: Empaquetar
        run: |
          echo "$GITHUB_SHA" > dist/perfumeria-landing/browser/version.txt
          tar -czf ankara-deploy.tar.gz server.js dist/perfumeria-landing/browser

      - name: Subir al servidor
        env:
          API_KEY: ${{ secrets.VORIAM_API_KEY }}
        run: |
          set -uo pipefail
          BASE="$PANEL/api/client/servers/$SERVER_ID"
          LOG=deploy.log
          : > "$LOG"
          FAILED=0

          # Llama a la API, registra código y respuesta, y marca fallo si no es 2xx.
          api() {
            local name="$1"; shift
            local out code redirect
            out=$(curl -sS -o resp.txt -w '%{http_code} %{redirect_url}' \
              -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" \
              -H "Content-Type: application/json" -H "X-Requested-With: XMLHttpRequest" "$@")
            code=${out%% *}; redirect=${out#* }
            echo "$name -> HTTP $code redirect=[${redirect%%\?*}] $(head -c 400 resp.txt)" | tee -a "$LOG"
            [[ "$code" =~ ^2 ]] || FAILED=1
          }

          upload() {
            local url code
            api "upload-url" "$BASE/files/upload"
            url=$(jq -r '.attributes.url' resp.txt)
            code=$(curl -sS -o resp.txt -w '%{http_code}' -F "files=@$1" "${url}&directory=/")
            echo "upload $1 -> HTTP $code $(head -c 200 resp.txt)" | tee -a "$LOG"
            [[ "$code" =~ ^2 ]] || FAILED=1
          }

          upload ankara-deploy.tar.gz
          api "delete-dist" -X POST "$BASE/files/delete" -d '{"root":"/","files":["dist"]}'
          api "decompress" -X POST "$BASE/files/decompress" -d '{"root":"/","file":"ankara-deploy.tar.gz"}'
          api "delete-archive" -X POST "$BASE/files/delete" -d '{"root":"/","files":["ankara-deploy.tar.gz"]}'
          api "restart" -X POST "$BASE/power" -d '{"signal":"restart"}'

          # Deja el registro en el servidor para poder revisarlo desde el panel.
          RESULT=$FAILED
          upload "$LOG" || true
          exit $RESULT

      - name: Comprobar que la web sirve esta versión
        run: |
          for i in $(seq 1 24); do
            got=$(curl -fsS -m 10 "$SITE_URL/version.txt" 2>/dev/null | tr -d '[:space:]')
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "La web sirve la versión $GITHUB_SHA en $SITE_URL"; exit 0
            fi
            echo "Aún no (versión servida: ${got:-ninguna}), reintentando..."
            sleep 5
          done
          echo "La web no se actualizó a $GITHUB_SHA"; exit 1
