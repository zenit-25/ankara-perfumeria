name: Publicar en Voriam

# Cada push a main compila la web y la sube al servidor de Voriam
# usando la API del panel (compatible con Pterodactyl).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: voriam
  cancel-in-progress: true

env:
  PANEL: https://panel.voriamtechnologies.com
  SERVER_ID: 089506a7
  SITE_URL: http://sftp-n1.voriamtechnologies.com:3011

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /

      - name: Marcar versión
        run: echo "$GITHUB_SHA" > dist/perfumeria-landing/browser/version.txt

      # El panel no permite operaciones de escritura (borrar, extraer, reiniciar)
      # con API key, pero sí pedir URLs de subida. Por eso se sube cada carpeta de
      # la build directamente a su ruta en el servidor; los archivos se sobrescriben.
      # server.js lee del disco en cada petición, así que no hace falta reiniciar
      # (solo si cambia server.js: reiniciar a mano desde el panel).
      - name: Subir al servidor
        env:
          API_KEY: ${{ secrets.VORIAM_API_KEY }}
        run: |
          set -euo pipefail
          BASE="$PANEL/api/client/servers/$SERVER_ID"

          # Sube los archivos dados a una carpeta del servidor (falla si no es 2xx).
          upload_to() {
            local dir="$1"; shift
            local url args=() code
            url=$(curl -fsS -H "Authorization: Bearer $API_KEY" -H "Accept: application/json" \
              "$BASE/files/upload" | jq -r '.attributes.url')
            for f in "$@"; do args+=(-F "files=@$f"); done
            code=$(curl -sS -o resp.txt -w '%{http_code}' "${args[@]}" \
              "${url}&directory=$(jq -rn --arg d "$dir" '$d|@uri')")
            echo "$dir <- $# archivo(s): HTTP $code"
            [[ "$code" =~ ^2 ]] || { head -c 300 resp.txt; echo; exit 1; }
          }

          upload_to / server.js

          cd dist/perfumeria-landing/browser
          # Una subida por carpeta; version.txt va al final para marcar el despliegue completo.
          find . -type d | sort | while read -r d; do
            mapfile -t files < <(find "$d" -maxdepth 1 -type f ! -name version.txt | sort)
            [ ${#files[@]} -eq 0 ] && continue
            sub="${d#.}"   # "." -> "", "./img" -> "/img"
            upload_to "/dist/perfumeria-landing/browser${sub}" "${files[@]}"
          done
          upload_to /dist/perfumeria-landing/browser version.txt

      - name: Comprobar que la web sirve esta versión
        run: |
          for i in $(seq 1 24); do
            got=$(curl -fsS -m 10 "$SITE_URL/version.txt" 2>/dev/null | tr -d '[:space:]')
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "La web sirve la versión $GITHUB_SHA en $SITE_URL"; exit 0
            fi
            echo "Aún no (versión servida: ${got:-ninguna}), reintentando..."
            sleep 5
          done
          echo "La web no se actualizó a $GITHUB_SHA"; exit 1
